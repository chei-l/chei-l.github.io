        /* 페이지 전환 오버레이 (유령이 박쥐 날개 잡고 횡단) */
        .page-transition-overlay {
            position: fixed;
            inset: 0;
            z-index: 99999;
            pointer-events: none;
            background: transparent;
            display: none;
            align-items: center;
            overflow: hidden;

        .page-transition-overlay.active {
            display: flex;

        .flying-couple {
            position: absolute;
            left: -350px;
            top: 45%;
            transform: translateY(-50%);
        }
        .page-transition-overlay.fly-right .flying-couple {
            animation: ghost-bat-fly-right 3.0s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
        @keyframes ghost-bat-fly-right {
            0% {
                left: -350px;
                transform: translateY(-50%) rotate(0deg) scale(0.85);
            }
            15% {
                transform: translateY(-40%) rotate(10deg) scale(1.05);
            }
            50% {
                transform: translateY(-60%) rotate(-12deg) scale(1.20);
            }
            85% {
                transform: translateY(-45%) rotate(8deg) scale(1.00);
            }
            100% {
                left: calc(100vw + 350px);
                transform: translateY(-50%) rotate(0deg) scale(0.9);
            }
        }
        .page-transition-overlay.fly-left .flying-couple {
            animation: ghost-bat-fly-left 3.0s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
        @keyframes ghost-bat-fly-left {
            0% {
                left: calc(100vw + 350px);
                transform: translateY(-50%) scaleX(-1) rotate(0deg) scale(0.85);
            }
            15% {

            }

            }
            100% {

                transform: translateY(-50%) scaleX(-1) rotate(0deg) scale(0.9);
            }

<style>
/* --- 화면 전체 폭발 섬광 및 충격파 스타일 --- */
.screen-explosion {
    position: fixed;
    inset: 0;
    z-index: 9998; /* 유령과 박쥐 뒤에 오되 다른 모든 콘텐츠 위에 오도록 */
    pointer-events: none;
    background: transparent;
    opacity: 0;
}
.screen-explosion.active {
    animation: screen-flash-animation 0.6s ease-out forwards;
}
@keyframes screen-flash-animation {
    0% {
        background-color: rgba(255, 0, 60, 0.45); /* 쨍한 빨간색 순간 플래시 */
        opacity: 1;
    }
    30% {
        background-color: rgba(160, 68, 255, 0.45); /* 쨍한 보라색 플래시 */
    }
    100% {
        background-color: transparent;
        opacity: 0;
    }
}

.shockwave-ring {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(0);
    width: 120px;
    height: 120px;
    border: 10px solid #ff003c;
    border-radius: 50%;
    opacity: 0;
    pointer-events: none;
}
.screen-explosion.active .shockwave-ring {
    animation: shockwave-expand-animation 0.7s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
}
@keyframes shockwave-expand-animation {
    0% {
        transform: translate(-50%, -50%) scale(0);
        border-color: #ff003c;
        border-width: 25px;
        opacity: 1;
    }
    40% {
        border-color: #a044ff;
        border-width: 12px;
    }
    100% {
        transform: translate(-50%, -50%) scale(22); /* 화면 전체를 뒤덮을 정도로 커짐 */
        border-color: transparent;
        border-width: 3px;
        opacity: 0;
    }
}

/* --- 고양이 프로필 이미지 폭발 및 복구 스타일 --- */
.hero-image {
    transition: opacity 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

/* 고양이 하악질 말풍선 스타일 */
#catSpeech {
    position: absolute;
    bottom: 220px; /* 고양이 이미지 머리 위 */
    left: 50%;
    transform: translate(-50%, 10px) scale(0.85);
    opacity: 0;
    z-index: 15;
    transition: opacity 0.3s ease, transform 0.3s ease;
    box-shadow: 4px 4px 0px #030206;
}
/* 고양이가 화날 때와 폭발할 때 머리 위에 하악질 대사 등장 */
#catHeroWrap.angry #catSpeech,
#catHeroWrap.exploded #catSpeech {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
}
/* 아래 방향 꼬리 */
#catSpeech::after {
    content: "";
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 8px 8px 0;
    border-style: solid;
    border-color: #0f0e1a transparent;
    display: block;
    width: 0;
}
#catSpeech::before {
    content: "";
    position: absolute;
    bottom: -11px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 11px 11px 0;
    border-style: solid;
    border-color: #2e1b4e transparent;
    display: block;
    width: 0;
    z-index: -1;
}

#catHeroWrap.angry {
    animation: cat-shake-furious 0.8s ease-in-out infinite;
    filter: drop-shadow(0 0 20px #ff003c);
}
@keyframes cat-shake-furious {
    0%, 100% { transform: translate(0, 0) scale(1); }
    20%, 60% { transform: translate(-5px, 5px) rotate(-4deg); }
    40%, 80% { transform: translate(5px, -5px) rotate(4deg); }
}



/* --- Spooky Characters 기본 스타일 --- */
.spooky-char {
    position: fixed;
    z-index: 999;
    display: flex;
    align-items: center;
    transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    pointer-events: none;
}
#spookyGhost {
    left: -250px;
    top: 55%;
    flex-direction: row;
}
#spookyBat {
    right: -250px;
    top: 40%;
    flex-direction: row-reverse;
}
.spooky-char.show {
    transform: translateX(275px);
}
#spookyBat.show {
    transform: translateX(-275px);
}

/* 짝수 번째 스핀 애니메이션 */
.spooky-char.spin-mode .baby-bat-svg {
    animation: bat-spin-animation 4.0s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}
@keyframes bat-spin-animation {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(720deg); }
}

/* 왼쪽 방향 대시 돌진 */
.spooky-char.dash-left {
    transition: transform 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) !important;
    transform: translateX(-120vw) !important;
}

/* 유령 도망가기 */
.spooky-char.run-away {
    transition: transform 1.0s cubic-bezier(0.25, 0.46, 0.45, 0.94) !important;
    transform: translateX(-120vw) !important;
}

/* 폭발 놀람/패닉 대피소 상태 */
.spooky-char.panic-look {
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) !important;
    transform: translateX(80px) !important; /* 구석으로 호다닥 숨어 머리만 보임 */
}
#spookyBat.panic-look {
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) !important;
    transform: translateX(-80px) !important;
}

/* 눈 두리번두리번 굴리기 애니메이션 */
.baby-ghost-svg circle[fill="#000000"],
.baby-bat-svg circle[fill="#000000"] {
    transform-box: fill-box;
    transform-origin: center;
}
.spooky-char.panic-look .baby-ghost-svg circle[fill="#000000"],
.spooky-char.panic-look .baby-bat-svg circle[fill="#000000"] {
    animation: eyes-look-around 0.4s ease-in-out infinite alternate;
}
@keyframes eyes-look-around {
    0% { transform: translateX(-3px); }
    100% { transform: translateX(3px); }
}

.speech-bubble {
    background: #0f0e1a;
    color: #ffffff;
    border: 3px solid #2e1b4e;
    padding: 10px 18px;
    border-radius: var(--radius-md);
    font-size: 1.1rem;
    font-weight: 700;
    position: relative;
    box-shadow: 4px 4px 0px #030206;
    opacity: 0;
    transform: scale(0.8);
    transition: opacity 0.3s ease, transform 0.3s ease;
    font-family: "Share Tech Mono", monospace;
    white-space: nowrap;
}
.spooky-char.show .speech-bubble {
    opacity: 1;
    transform: scale(1);
    transition-delay: 0.4s;
}

/* 유령 말풍선 꼬리 (왼쪽 방향) */
#spookyGhost .speech-bubble {
    margin-left: -10px;
}
#spookyGhost .speech-bubble::after {
    content: "";
    position: absolute;
    top: 50%;
    left: -8px;
    transform: translateY(-50%);
    border-width: 8px 8px 8px 0;
    border-style: solid;
    border-color: transparent #0f0e1a;
    display: block;
    width: 0;
}
#spookyGhost .speech-bubble::before {
    content: "";
    position: absolute;
    top: 50%;
    left: -11px;
    transform: translateY(-50%);
    border-width: 11px 11px 11px 0;
    border-style: solid;
    border-color: transparent #2e1b4e;
    display: block;
    width: 0;
    z-index: -1;
}

/* 박쥐 말풍선 꼬리 (오른쪽 방향) */
#spookyBat .speech-bubble {
    margin-right: -10px;
}
#spookyBat .speech-bubble::after {
    content: "";
    position: absolute;
    top: 50%;
    right: -8px;
    transform: translateY(-50%);
    border-width: 8px 0 8px 8px;
    border-style: solid;
    border-color: transparent #0f0e1a;
    display: block;
    width: 0;
}

    <!-- Back to Top Button -->
    <button class="back-to-top" id="backToTop" aria-label="맨 위로">↑</button>

    <script>
        // Back to top button
        const backToTop = document.getElementById('backToTop');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                backToTop.classList.add('visible');
            } else {
                backToTop.classList.remove('visible');
            }
        });
        backToTop.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // 페이지 전환시 슝슝(Whoosh) 효과음 재생
        (function() {
            let audioCtx = null;
            const playWhoosh = () => {
                return new Promise((resolve) => {
                    try {
                        const AudioContext = window.AudioContext || window.webkitAudioContext;
                        if (!AudioContext) {
                            resolve();
                            return;
                        }
                        if (!audioCtx) {
                            audioCtx = new AudioContext();
                        }
                        if (audioCtx.state === 'suspended') {
                            audioCtx.resume();
                        }

                        // 슝슝 바람을 가르는 Whoosh 효과음 합성 (3.0초 분량)
                        const bufferSize = audioCtx.sampleRate * 3.0;
                        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                        const output = noiseBuffer.getChannelData(0);
                        for (let i = 0; i < bufferSize; i++) {
                            output[i] = Math.random() * 2 - 1;
                        }
                        const noise = audioCtx.createBufferSource();
                        noise.buffer = noiseBuffer;

                        const filter = audioCtx.createBiquadFilter();
                        filter.type = 'bandpass';
                        // 3초에 맞추어 주파수 변화를 완만하고 길게 연장
                        filter.frequency.setValueAtTime(200, audioCtx.currentTime);
                        filter.frequency.exponentialRampToValueAtTime(2000, audioCtx.currentTime + 1.2);
                        filter.frequency.exponentialRampToValueAtTime(250, audioCtx.currentTime + 2.8);
                        filter.Q.setValueAtTime(3.5, audioCtx.currentTime);

                        const gain = audioCtx.createGain();
                        gain.gain.setValueAtTime(0, audioCtx.currentTime);
                        gain.gain.linearRampToValueAtTime(0.85, audioCtx.currentTime + 0.1);
                        gain.gain.setValueAtTime(0.85, audioCtx.currentTime + 2.9); // 소리가 끝날 때까지 똑같은 볼륨 유지!
                        gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 3.0);

                        noise.connect(filter);
                        filter.connect(gain);
                        gain.connect(audioCtx.destination);

                        noise.start();
                        noise.stop(audioCtx.currentTime + 3.0);

                        // 소리가 3초 동안 충분히 재생되도록 2.8초 대기 후 이동 약속(resolve) 수행
                        setTimeout(resolve, 2800);
                    } catch (e) {
                        console.log("Whoosh 재생 실패:", e);
                        resolve();
                    }
                });
            };

            // 내부 모든 페이지 이동 링크 클릭을 낚아채어 슝슝 소리 출력 및 유령+박쥐 이동 애니메이션
            document.addEventListener('click', function(e) {
                const link = e.target.closest('a');
                if (!link) return;

                const href = link.getAttribute('href');
                if (!href || href.startsWith('#') || href.startsWith('javascript:') || link.getAttribute('target') === '_blank') {
                    return;
                }

                // 외부 사이트 이동이 아닌 동일 사이트 내 메뉴 이동 시에만 작동
                const isInternal = href.startsWith('/') || href.startsWith(window.location.origin) || !href.includes('://');
                if (isInternal) {
                    e.preventDefault();
                    
                    // 메뉴 인덱스 매핑: 홈=0, 블로그=1, 게임=2, 그림=3, AI그림=4, 소개=5
                    const menuPaths = [
                        '/',
                        '/posts/',
                        '/games/',
                        '/drawings/',
                        '/ai_drawings/',
                        '/about/'
                    ];
                    
                    // 현재 활성화된 메뉴 찾기
                    const activeLink = document.querySelector('.nav-link.active');
                    let currentIndex = 0;
                    if (activeLink) {
                        const activeHref = activeLink.getAttribute('href');
                        currentIndex = menuPaths.findIndex(p => activeHref.includes(p) || (activeHref === '/' && p === '/'));
                        if (currentIndex === -1) currentIndex = 0;
                    }
                    
                    // 클릭한 메뉴의 인덱스 알아내기
                    let targetIndex = 0;
                    const tempA = document.createElement('a');
                    tempA.href = href;
                    const targetPath = tempA.pathname;
                    
                    targetIndex = menuPaths.findIndex(p => targetPath === p || targetPath.startsWith(p));
                    if (targetIndex === -1) targetIndex = 0;
                    
                    // 애니메이션 오버레이 켜기 및 방향 클래스 지정 (가는 방향으로 유령과 박쥐가 날아감)
                    const overlay = document.getElementById('pageTransitionOverlay');
                    if (overlay) {
                        overlay.classList.remove('fly-right', 'fly-left', 'active');
                        
                        // 현재 메뉴보다 대상 메뉴가 오른쪽에 있으면 오른쪽으로 날아가고, 왼쪽에 있으면 왼쪽으로 날아감
                        if (targetIndex >= currentIndex) {
                            overlay.classList.add('fly-right');
                        } else {
                            overlay.classList.add('fly-left');
                        }
                        
                        // 강제 리플로우로 애니메이션 리셋 트리거
                        void overlay.offsetWidth;
                        overlay.classList.add('active');
                    }
                    
                    playWhoosh().then(() => {
                        window.location.href = href;
                    });
                }
            });
        })();
    </script>

    
<script>
(function() {
    // Entrance animations
    const animEls = document.querySelectorAll('[data-anim]');
    animEls.forEach(el => {
        const delay = parseInt(el.dataset.delay || '0', 10);
        setTimeout(() => el.classList.add('anim-in'), 100 + delay);
    });

    // Floating particles
    const canvas = document.getElementById('heroParticles');
    if (!canvas) return;
    const container = canvas.parentElement;
    const COUNT = 30;
    const particles = [];

    for (let i = 0; i < COUNT; i++) {
        const p = document.createElement('span');
        p.className = 'particle';
        const size = Math.random() * 3 + 1;
        const x = Math.random() * 100;
        const dur = Math.random() * 15 + 10;
        const delay = Math.random() * -20;
        p.style.cssText = `
            width:${size}px;height:${size}px;
            left:${x}%;
            animation-duration:${dur}s;
            animation-delay:${delay}s;
            opacity:${Math.random() * 0.5 + 0.1};
        `;
        canvas.appendChild(p);
    }

    // Mouse-following glow
    const glow = document.querySelector('.hero-glow');
    if (!glow) return;
    document.addEventListener('mousemove', e => {
        requestAnimationFrame(() => {
            glow.style.setProperty('--gx', e.clientX + 'px');
            glow.style.setProperty('--gy', e.clientY + 'px');
        });
    });

    // Web Audio API를 활용한 효과음 합성 재생 장치 (Autoplay 해제 핸들러 탑재)
    let audioCtx = null;
    const unlockAudio = () => {
        if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) {
                audioCtx = new AudioContext();
            }
        }
        if (audioCtx) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            // 소리 없는 버퍼 생성 후 즉시 재생하여 브라우저 오디오 시스템 활성화
            const buffer = audioCtx.createBuffer(1, 1, 22050);
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(audioCtx.destination);
            source.start(0);
        }
    };

    // 사용자가 화면 어디든 클릭하거나 터치하기만 해도 브라우저 사운드 잠금을 완전히 해제해요!
    document.addEventListener('click', unlockAudio, { once: true });
    document.addEventListener('touchstart', unlockAudio, { once: true });

    // Web Audio API를 활용한 고양이 하악질 효과음(캬아아악!) 합성 재생
    const playHissSound = () => {
        try {
            unlockAudio(); // 재생 시점에도 강제로 한 번 더 깨우기 시도
            if (!audioCtx) return;
            
            // 1. 화이트 노이즈 (하악질 바람 소리 "쉬이익")
            const bufferSize = audioCtx.sampleRate * 0.85;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }
            const hissNoise = audioCtx.createBufferSource();
            hissNoise.buffer = noiseBuffer;

            const hissFilter = audioCtx.createBiquadFilter();
            hissFilter.type = 'bandpass';
            hissFilter.frequency.setValueAtTime(2500, audioCtx.currentTime);
            hissFilter.frequency.exponentialRampToValueAtTime(5000, audioCtx.currentTime + 0.35);
            hissFilter.Q.value = 3.0;

            const hissGain = audioCtx.createGain();
            hissGain.gain.setValueAtTime(0, audioCtx.currentTime);
            hissGain.gain.linearRampToValueAtTime(0.9, audioCtx.currentTime + 0.05); // 빠른 어택
            hissGain.gain.setValueAtTime(0.9, audioCtx.currentTime + 0.8); // 0.8초 동안 최대 볼륨 유지!
            hissGain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.83);

            // 2. 비명 공명 오실레이터 (캬아아악의 날카로운 비명 성분 "아아악")
            const osc = audioCtx.createOscillator();
            const oscGain = audioCtx.createGain();
            
            osc.type = 'sawtooth'; // 거친 톱니파로 화난 느낌 강조
            osc.frequency.setValueAtTime(900, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1600, audioCtx.currentTime + 0.4); // 주파수가 급상승하는 캬악 비명
            
            const oscFilter = audioCtx.createBiquadFilter();
            oscFilter.type = 'lowpass';
            oscFilter.frequency.setValueAtTime(2200, audioCtx.currentTime); // 너무 쏘지 않게 깎아줌
            
            oscGain.gain.setValueAtTime(0, audioCtx.currentTime);
            oscGain.gain.linearRampToValueAtTime(0.25, audioCtx.currentTime + 0.08); // 약간 섞어주기
            oscGain.gain.setValueAtTime(0.25, audioCtx.currentTime + 0.5); // 0.5초 동안 동일 볼륨 유지!
            oscGain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.53);

            // 연결
            hissNoise.connect(hissFilter);
            hissFilter.connect(hissGain);
            hissGain.connect(audioCtx.destination);

            osc.connect(oscFilter);
            oscFilter.connect(oscGain);
            oscGain.connect(audioCtx.destination);

            hissNoise.start();
            osc.start();
            hissNoise.stop(audioCtx.currentTime + 0.85);
            osc.stop(audioCtx.currentTime + 0.85);
            
        } catch (err) {
            console.log("효과음 재생 실패:", err);
        }
    };

    // Spooky ghost, bat and cat greetings
    const ghost = document.getElementById('spookyGhost');
    const bat = document.getElementById('spookyBat');
    const catWrap = document.getElementById('catHeroWrap');
    const screenExp = document.getElementById('screenExplosion');
    
    if (ghost && bat && catWrap && screenExp) {
        const greetings = ["HELLO!", "HI THERE!", "BOO!", "WELCOME!", "WELCOME TO THE DARK!"];
        let triggerCount = 0;
        
        const triggerGreeting = () => {
            triggerCount++;
            
            // 모든 상태 클래스 초기화
            bat.classList.remove('show', 'spin-mode', 'dash-left', 'panic-look');
            ghost.classList.remove('show', 'run-away', 'panic-look');
            catWrap.classList.remove('angry', 'exploded');
            screenExp.classList.remove('active');
            
            // 말풍선 기본 상태
            ghost.querySelector('.speech-bubble').style.display = 'none';
            bat.querySelector('.speech-bubble').style.display = 'none';

            // --- 1단계: 유령/박쥐 등장 (0.0초 ~ 4.5초) ---
            if (triggerCount % 2 !== 0) {
                // [홀수 번째] 원래대로 동작 (유령 빼고 박쥐만 3초간 등장)
                setTimeout(() => {
                    const randBat = greetings[Math.floor(Math.random() * greetings.length)];
                    bat.querySelector('.speech-bubble').innerText = randBat;
                    bat.querySelector('.speech-bubble').style.display = 'block';
                    bat.classList.add('show');
                }, 1500);
                
                setTimeout(() => {
                    bat.classList.remove('show');
                    bat.querySelector('.speech-bubble').style.display = 'none';
                }, 4500);
            } else {
                // [짝수 번째] 꼬마유령이 "술래다 도망쳐!!"라고 외치고 박쥐는 2바퀴 회전 -> 4.0초 시점에 유령을 잡으러 왼쪽으로 돌진
                setTimeout(() => {
                    ghost.querySelector('.speech-bubble').innerText = "술래다 도망쳐!!";
                    ghost.querySelector('.speech-bubble').style.display = 'block';
                    ghost.classList.add('show');
                    
                    bat.classList.add('show', 'spin-mode');
                }, 1500);
                
                setTimeout(() => {
                    bat.classList.add('dash-left');
                    ghost.classList.add('run-away');
                }, 4000);
            }

            // --- 2단계: 고양이 화남 돌입 (9.2초 시점) ---
            setTimeout(() => {
                catWrap.classList.add('angry');
            }, 9200);

            // --- 3단계: 고양이 쾅! 폭발 및 화면전체 폭발 효과 & 유령/박쥐 구석 대피 (10.0초 시점) ---
            setTimeout(() => {
                catWrap.classList.remove('angry');
                catWrap.classList.add('exploded');
                screenExp.classList.add('active'); // 화면 전체 섬광 및 충격파 퍼짐
                
                // 고양이 하악질 소리만 캬아악 재생!
                playHissSound();
                
                // 폭발에 깜짝 놀라서 유령과 박쥐는 구석 대피 모드 작동
                bat.classList.remove('spin-mode', 'dash-left');
                ghost.classList.remove('run-away');
                
                bat.classList.add('show', 'panic-look');
                ghost.classList.add('show', 'panic-look');
                
                // 놀란 대사 외침
                ghost.querySelector('.speech-bubble').innerText = "엄마야!";
                ghost.querySelector('.speech-bubble').style.display = 'block';
                
                bat.querySelector('.speech-bubble').innerText = "깜짝이야!";
                bat.querySelector('.speech-bubble').style.display = 'block';
            }, 10000);

            // --- 4단계: 고양이 재생 복구 및 유령/박쥐 퇴장 (12.0초 시점) ---
            setTimeout(() => {
                catWrap.classList.remove('exploded'); // 고양이 서서히 스르륵 재생
                screenExp.classList.remove('active');
                
                bat.classList.remove('show', 'panic-look');
                ghost.classList.remove('show', 'panic-look');
            }, 12000);
        };

        // 거대한 스토리 사이클(14초 주기)을 돌려요!
        setTimeout(() => {
            triggerGreeting();
            setInterval(triggerGreeting, 14000);
        }, 1500);
    }
})();
</script>
