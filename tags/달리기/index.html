    <script>
        // Back to top button
        const backToTop = document.getElementById('backToTop');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                backToTop.classList.add('visible');
            } else {
                backToTop.classList.remove('visible');
            }
        });
        backToTop.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // 페이지 전환시 슝슝(Whoosh) 효과음 재생
        (function() {
            let audioCtx = null;
            const playWhoosh = () => {
                return new Promise((resolve) => {
                    try {
                        const AudioContext = window.AudioContext || window.webkitAudioContext;
                        if (!AudioContext) {
                            resolve();
                            return;
                        }
                        if (!audioCtx) {
                            audioCtx = new AudioContext();
                        }
                        if (audioCtx.state === 'suspended') {
                            audioCtx.resume();
                        }

                        // 슝슝 바람을 가르는 Whoosh 효과음 합성 (3.0초 분량)
                        const bufferSize = audioCtx.sampleRate * 3.0;
                        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                        const output = noiseBuffer.getChannelData(0);
                        for (let i = 0; i < bufferSize; i++) {
                            output[i] = Math.random() * 2 - 1;
                        }
                        const noise = audioCtx.createBufferSource();
                        noise.buffer = noiseBuffer;

                        const filter = audioCtx.createBiquadFilter();
                        filter.type = 'bandpass';
                        // 3초에 맞추어 주파수 변화를 완만하고 길게 연장
                        filter.frequency.setValueAtTime(200, audioCtx.currentTime);
                        filter.frequency.exponentialRampToValueAtTime(2000, audioCtx.currentTime + 1.2);
                        filter.frequency.exponentialRampToValueAtTime(250, audioCtx.currentTime + 2.8);
                        filter.Q.setValueAtTime(3.5, audioCtx.currentTime);

                        const gain = audioCtx.createGain();
                        gain.gain.setValueAtTime(0, audioCtx.currentTime);
                        gain.gain.linearRampToValueAtTime(0.85, audioCtx.currentTime + 0.1);
                        gain.gain.setValueAtTime(0.85, audioCtx.currentTime + 2.9); // 소리가 끝날 때까지 똑같은 볼륨 유지!
                        gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 3.0);

                        noise.connect(filter);
                        filter.connect(gain);
                        gain.connect(audioCtx.destination);

                        noise.start();
                        noise.stop(audioCtx.currentTime + 3.0);

                        // 소리가 3초 동안 충분히 재생되도록 2.8초 대기 후 이동 약속(resolve) 수행
                        setTimeout(resolve, 2800);
                    } catch (e) {
                        console.log("Whoosh 재생 실패:", e);
                        resolve();
                    }
                });
            };

            // 내부 모든 페이지 이동 링크 클릭을 낚아채어 슝슝 소리 출력 및 유령+박쥐 이동 애니메이션
            document.addEventListener('click', function(e) {
                const link = e.target.closest('a');
                if (!link) return;

                const href = link.getAttribute('href');
                if (!href || href.startsWith('#') || href.startsWith('javascript:') || link.getAttribute('target') === '_blank') {
                    return;
                }

                // 외부 사이트 이동이 아닌 동일 사이트 내 메뉴 이동 시에만 작동
                const isInternal = href.startsWith('/') || href.startsWith(window.location.origin) || !href.includes('://');
                if (isInternal) {
                    e.preventDefault();
                    
                    // 메뉴 인덱스 매핑: 홈=0, 블로그=1, 게임=2, 그림=3, AI그림=4, 소개=5
                    const menuPaths = [
                        '/',
                        '/posts/',
                        '/games/',
                        '/drawings/',
                        '/ai_drawings/',
                        '/about/'
                    ];
                    
                    // 현재 활성화된 메뉴 찾기
                    const activeLink = document.querySelector('.nav-link.active');
                    let currentIndex = 0;
                    if (activeLink) {
                        const activeHref = activeLink.getAttribute('href');
                        currentIndex = menuPaths.findIndex(p => activeHref.includes(p) || (activeHref === '/' && p === '/'));
                        if (currentIndex === -1) currentIndex = 0;
                    }
                    
                    // 클릭한 메뉴의 인덱스 알아내기
                    let targetIndex = 0;
                    const tempA = document.createElement('a');
                    tempA.href = href;
                    const targetPath = tempA.pathname;
                    
                    targetIndex = menuPaths.findIndex(p => targetPath === p || targetPath.startsWith(p));
                    if (targetIndex === -1) targetIndex = 0;
                    
                    // 애니메이션 오버레이 켜기 및 방향 클래스 지정 (가는 방향으로 유령과 박쥐가 날아감)
                    const overlay = document.getElementById('pageTransitionOverlay');
                    if (overlay) {
                        overlay.classList.remove('fly-right', 'fly-left', 'active');
                        
                        // 현재 메뉴보다 대상 메뉴가 오른쪽에 있으면 오른쪽으로 날아가고, 왼쪽에 있으면 왼쪽으로 날아감
                        if (targetIndex >= currentIndex) {
                            overlay.classList.add('fly-right');
                        } else {
                            overlay.classList.add('fly-left');
                        }
                        
                        // 강제 리플로우로 애니메이션 리셋 트리거
                        void overlay.offsetWidth;
                        overlay.classList.add('active');
                    }
                    
                    playWhoosh().then(() => {
                        window.location.href = href;
                    });
                }
            });
        })();
    </script>
